{% extends 'base.html' %}

{% block title %}My Profile{% endblock %}
{% block page_title %}Consumer Profile & Account Settings{% endblock %}

{% block content %}
<div class="card" style="max-width: 820px; margin: 0 auto;">
    <div class="card-header">
        <h2 class="card-title"><i class="fa-solid fa-address-card"></i> Manage Personal Information</h2>
        <span class="badge badge-{% if consumer.status == 'Active' %}success{% else %}warning{% endif %}">
            Status: {{ consumer.status }}
        </span>
    </div>

    <form method="POST" action="{% url 'accounts:consumer_profile' %}">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="fname">First Name *</label>
                <input type="text" id="fname" name="fname" class="form-control" value="{{ consumer.fname }}" required maxlength="20">
            </div>
            <div class="form-group">
                <label class="form-label" for="lname">Last Name *</label>
                <input type="text" id="lname" name="lname" class="form-control" value="{{ consumer.lname }}" required maxlength="20">
            </div>
            <div class="form-group">
                <label class="form-label" for="dob">Date of Birth *</label>
                <input type="date" id="dob" name="dob" class="form-control" value="{{ consumer.dob|date:'Y-m-d' }}" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="consumertype">Consumer Type</label>
                <select id="consumertype" name="consumertype" class="form-control">
                    <option value="Regular" {% if consumer.consumertype == 'Regular' %}selected{% endif %}>Regular (Home Appliance)</option>
                    <option value="Commercial" {% if consumer.consumertype == 'Commercial' %}selected{% endif %}>Commercial / Business</option>
                </select>
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label class="form-label" for="address">Address *</label>
                <input type="text" id="address" name="address" class="form-control" value="{{ consumer.address }}" required maxlength="30">
            </div>
            <div class="form-group">
                <label class="form-label" for="statid">State *</label>
                <select id="statid" name="statid" class="form-control" required>
                    {% for st in states %}
                        <option value="{{ st.statid }}" {% if consumer.statid_id == st.statid %}selected{% endif %}>{{ st.state }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="Distid">District *</label>
                <select id="Distid" name="Distid" class="form-control" required>
                    {% for d in districts %}
                        <option value="{{ d.Distid }}" {% if consumer.Distid_id == d.Distid %}selected{% endif %}>{{ d.District }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="pin">PIN Code *</label>
                <input type="text" id="pin" name="pin" class="form-control" value="{{ consumer.pin }}" required maxlength="8">
            </div>
            <div class="form-group">
                <label class="form-label" for="mob">Mobile Number *</label>
                <input type="tel" id="mob" name="mob" class="form-control" value="{{ consumer.mob }}" required maxlength="20">
            </div>
            <div class="form-group">
                <label class="form-label" for="phone">Alternative Phone</label>
                <input type="tel" id="phone" name="phone" class="form-control" value="{{ consumer.phone }}" maxlength="20">
            </div>
            <div class="form-group">
                <label class="form-label">Registered Email (Username)</label>
                <input type="email" class="form-control" value="{{ consumer.email }}" disabled style="background-color: #F1F5F9; cursor: not-allowed;">
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label class="form-label" for="new_password">Change Password (leave blank to keep current password)</label>
                <input type="password" id="new_password" name="new_password" class="form-control" placeholder="Enter new password if updating">
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label class="form-label" for="remarks">Remarks / Delivery Notes</label>
                <input type="text" id="remarks" name="remarks" class="form-control" value="{{ consumer.remarks|default:'' }}" maxlength="30">
            </div>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">
                <i class="fa-solid fa-save"></i> Save Profile Changes
            </button>
        </div>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const stateSelect = document.getElementById('statid');
        const distSelect = document.getElementById('Distid');

        stateSelect.addEventListener('change', function() {
            const sid = this.value;
            if (!sid) return;
            distSelect.innerHTML = '<option value="">Loading...</option>';
            fetch(/api/districts//)
                .then(r => r.json())
                .then(data => {
                    distSelect.innerHTML = '';
                    data.districts.forEach(d => {
                        const opt = document.createElement('option');
                        opt.value = d.id;
                        opt.textContent = d.name;
                        distSelect.appendChild(opt);
                    });
                });
        });
    });
</script>
{% endblock %}
