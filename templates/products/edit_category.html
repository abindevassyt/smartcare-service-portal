{% extends 'base.html' %}

{% block title %}Edit Category{% endblock %}
{% block page_title %}Edit Category #{{ category.pcatid }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <div class="card-header">
        <h2 class="card-title"><i class="fa-solid fa-pen-to-square"></i> Modify Category Name</h2>
        <a href="{% url 'products:manage_categories' %}" class="btn btn-secondary btn-sm">Back to List</a>
    </div>

    <form method="POST" action="{% url 'products:edit_category' category.pcatid %}">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label" for="category">Category Name *</label>
            <input type="text" id="category" name="category" class="form-control" value="{{ category.category }}" required maxlength="20">
        </div>
        <div style="display: flex; gap: 12px; margin-top: 20px;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">
                <i class="fa-solid fa-check"></i> Update Category
            </button>
            <a href="{% url 'products:manage_categories' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
