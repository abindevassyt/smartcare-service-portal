{% extends 'base.html' %}

{% block title %}Edit Spare Part{% endblock %}
{% block page_title %}Edit Spare Part #{{ spare.spareid }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div class="card-header">
        <h2 class="card-title"><i class="fa-solid fa-pen-to-square"></i> Update Spare Part Details</h2>
        <a href="{% url 'products:manage_spare_parts' %}" class="btn btn-secondary btn-sm">Back to Spares</a>
    </div>

    <form method="POST" action="{% url 'products:edit_spare_part' spare.spareid %}">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label" for="prid">Associated Product *</label>
            <select id="prid" name="prid" class="form-control" required>
                {% for p in products %}
                    <option value="{{ p.prid }}" {% if spare.prid_id == p.prid %}selected{% endif %}>{{ p.prname }} ({{ p.model }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label" for="partsname">Part Name *</label>
            <input type="text" id="partsname" name="partsname" class="form-control" value="{{ spare.partsname }}" required maxlength="20">
        </div>
        <div class="form-group">
            <label class="form-label" for="price">Unit Price (?) *</label>
            <input type="number" step="0.01" id="price" name="price" class="form-control" value="{{ spare.price }}" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="qty">Current Quantity in Stock *</label>
            <input type="number" id="qty" name="qty" class="form-control" value="{{ spare.qty }}" min="0" required>
        </div>
        <div style="display: flex; gap: 12px; margin-top: 20px;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">
                <i class="fa-solid fa-check"></i> Update Stock Details
            </button>
            <a href="{% url 'products:manage_spare_parts' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
