{% extends 'base.html' %}

{% block title %}Edit Status{% endblock %}
{% block page_title %}Edit Status #{{ status.Wo_stid }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <div class="card-header">
        <h2 class="card-title"><i class="fa-solid fa-pen-to-square"></i> Modify Status Name</h2>
        <a href="{% url 'services:manage_statuses' %}" class="btn btn-secondary btn-sm">Back to Statuses</a>
    </div>

    <form method="POST" action="{% url 'services:edit_status' status.Wo_stid %}">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label" for="W_status">Status Name *</label>
            <input type="text" id="W_status" name="W_status" class="form-control" value="{{ status.W_status }}" required maxlength="20">
        </div>
        <div style="display: flex; gap: 12px; margin-top: 20px;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">
                <i class="fa-solid fa-check"></i> Update Status
            </button>
            <a href="{% url 'services:manage_statuses' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
